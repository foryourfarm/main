# PR·머지 시 자동 검사. 테스트 실행을 사람의 성실성이 아니라 구조에 맡긴다.
#
# 여기서 검사하지 **않는** 것(숨기지 않고 명시):
#   - 마이그레이션 실 DB 적용 — 아래 backend job은 Postgres를 띄우지 않는다(이유는 job 주석).
#     `alembic upgrade head`는 여전히 수동 검증 대상이다.
#   - 로컬 LLM(Ollama) 연동 — CI에 모델을 띄우지 않는다. 관련 테스트는 전부 스텁 기반.
name: CI

on:
  # 리뷰 전에 검사한다. base가 dev인 이유는 CLAUDE.md §14 — main은 배포 전용이라
  # 일반 기능 PR의 대상이 아니다.
  pull_request:
    branches: [dev, main]
  # push를 dev·main에만 거는 이유: 조건 없이 걸면 feature 브랜치 푸시마다
  # PR 검사와 중복으로 두 번 돈다. 지금은 "PR에서 1회 + 머지 결과물 1회"로 겹치지 않는다.
  push:
    branches: [dev, main]

# 최소 권한 원칙. 이 워크플로는 코드를 읽기만 하면 되고 쓰기 토큰이 필요 없다(§17).
permissions:
  contents: read

# 같은 PR에 새 커밋을 푸시하면 이전 실행을 취소한다 — 어차피 낡은 코드의 결과라
# 기다릴 이유가 없고, 무료 사용량도 아낀다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        # backend/에 conftest.py·pytest.ini·pyproject.toml이 없어 pytest가 `app` 패키지를
        # 찾으려면 여기가 작업 디렉터리여야 한다. 리포 루트에서 돌리면
        # "23 errors during collection / No module named 'app'"으로 죽는다(실측).
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 로컬 개발은 3.14지만 배포는 backend/Dockerfile의 python:3.13-slim이다.
          # CI는 개발 환경이 아니라 **배포 환경**을 흉내내야 "내 컴퓨터에선 되는데요"를 잡는다.
          python-version: "3.13"
          cache: pip
          # working-directory는 run에만 적용된다 — action 입력 경로는 리포 루트 기준이라
          # backend/를 붙여야 한다(흔한 함정).
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: 의존성 설치
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: pytest
        # DB·시크릿 없이 돈다. app/core/config.py의 모든 필드에 기본값이 있어 .env 없이도
        # import되는 것을 확인했다(Settings(_env_file=None) 로드 성공).
        # 덕분에 CI에 API 키를 등록할 필요가 없다 — 유출 경로 자체를 만들지 않는다.
        run: pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Next 16 요구사항을 넉넉히 넘기는 현행 LTS.
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        # npm install이 아니라 ci — 락파일을 그대로 설치하고, 어긋나면 고치지 않고 실패한다.
        # install은 락파일을 수정할 수 있어 CI 실행마다 다른 버전이 깔릴 수 있다.
        run: npm ci

      - name: 타입 검사
        # package.json에 typecheck 스크립트가 없어 devDependencies의 tsc를 직접 부른다.
        # --noEmit: 결과물을 만들지 않고 타입만 본다. strict 위반을 build보다 먼저·빠르게 잡는다.
        run: npx tsc --noEmit

      - name: 빌드
        # tsc가 못 잡는 것들(RSC/CSR 경계 위반, 라우트 규약 오류 등)은 빌드에서만 드러난다.
        # NEXT_PUBLIC_API_BASE는 lib/auth.ts·lib/chat.ts에서 `?? "http://localhost:8000"`로
        # 폴백하므로 CI에 환경변수를 주지 않아도 빌드가 성립한다.
        run: npm run build
