spring:
  application:
    name: foryourfarm-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/foryourfarm}
    username: ${DB_USERNAME:foryourfarm}
    password: ${DB_PASSWORD:foryourfarm}
  jpa:
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway가 관리, Hibernate는 검증만
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    locations: classpath:db/migration

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-local-env}
  llm:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:exaone3.5:7.8b}
    timeout-ms: ${OLLAMA_TIMEOUT_MS:8000}
