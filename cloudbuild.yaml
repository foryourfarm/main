# Cloud Build 설정 — 백엔드 이미지 빌드/푸시.
#
# 왜 이 파일이 필요한가: `gcloud builds submit --tag`은 빌드 컨텍스트 루트의 `Dockerfile`만
# 찾는다. 우리 Dockerfile은 backend/에 있는데 컨텍스트는 리포 루트여야 하므로
# (docs/seed/를 런타임에 참조 — backend/Dockerfile 주석 참고) --tag 방식으로는 빌드할 수 없다.
# docker build에 -f를 직접 넘기는 이 설정으로 그 조합을 만든다.
#
# 실행: gcloud builds submit --config cloudbuild.yaml .
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - backend/Dockerfile
      - -t
      - gcr.io/$PROJECT_ID/foryourfarm-backend
      - .

images:
  - gcr.io/$PROJECT_ID/foryourfarm-backend
